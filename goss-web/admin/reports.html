<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports — GOSS Admin</title>
<link rel="icon" type="image/png" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/css/style.css">
<style>
.report-document { max-width: 1100px; margin: 0 auto; }
.report-heading { display: flex; align-items: center; gap: 16px; padding-bottom: 18px; border-bottom: 2px solid var(--primary-teal); margin-bottom: 18px; }
.report-heading img { width: 64px; height: 64px; object-fit: contain; }
.report-heading h1 { margin: 0 0 4px; font-size: 24px; }
.report-heading p { margin: 2px 0; color: var(--text-secondary); font-size: 13px; }
.report-meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 24px; margin-bottom: 22px; font-size: 13px; }
.report-section { margin: 0 0 20px; }
.report-section h2 { font-size: 16px; margin: 0 0 8px; }
.report-section table { background: #fff; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
.report-section th { background: var(--primary-teal-light); color: var(--text-primary); }
.report-section td:last-child, .report-section th:last-child { width: 110px; text-align: right; }
.report-section tfoot td { font-weight: 700; border-top: 2px solid var(--border); }
.report-summary { margin-bottom: 24px; }
.report-summary th:first-child, .report-summary td:first-child { width: 72%; }
.report-section td, .report-section th { padding: 9px 10px; }
.report-timeline td:first-child { white-space: nowrap; }
.timeline-bar { display: flex; width: 100%; height: 12px; overflow: hidden; border-radius: 6px; background: #edf1ed; }
.timeline-bar span { display: block; min-width: 0; height: 100%; }
.timeline-concerns { background: #1e7a34; }
.timeline-messages { background: #f4791f; }
.timeline-appointments { background: #8b5cf6; }
.report-legend { display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 10px; font-size: 12px; color: var(--text-secondary); }
.report-legend span { display: inline-flex; align-items: center; gap: 6px; }
.report-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.report-legend .legend-concerns { background: #1e7a34; }
.report-legend .legend-messages { background: #f4791f; }
.report-legend .legend-appointments { background: #8b5cf6; }
.print-preview-dialog { max-width: 1040px; width: 100%; max-height: 92vh; display: flex; flex-direction: column; padding: 0; }
.print-preview-header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 24px; border-bottom: 1px solid var(--border); }
.print-preview-header h2 { margin: 0 0 4px; font-size: 18px; }
.print-preview-header p { margin: 0; color: var(--text-secondary); font-size: 13px; }
.print-preview-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.print-preview-content { overflow: auto; padding: 24px; background: #edf1ed; }
.print-preview-content .report-document { max-width: 900px; min-height: 900px; margin: 0 auto; padding: 40px; background: #fff; box-shadow: 0 2px 12px rgba(17, 24, 39, .16); }
@media print {
  @page { size: A4 portrait; margin: 14mm; }
  .sidebar, .topbar, .report-controls, .print-preview-overlay { display: none !important; }
  body, .app-shell, .main, .content { display: block; min-height: 0; overflow: visible; background: #fff; }
  .content { padding: 0; }
  .report-document { max-width: none; }
  .report-section table { font-size: 10pt; }
  .report-section th, .report-section td { padding: 6px 8px; }
  .report-section thead { display: table-header-group; }
  .timeline-bar { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
}
</style>
</head>
<body>
<div class="app-shell" id="shell"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>window.ROOT_PATH = "../";</script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/shell.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<script>
let currentReport = null;

function reportRows(title, rows, labelKey, countKey) {
  const total = rows.reduce((sum, row) => sum + Number(row[countKey] || 0), 0);
  const body = rows.map(row => {
    const rawLabel = row[labelKey];
    const label = labelKey === 'month'
      ? new Date(`${rawLabel}-01T12:00:00`).toLocaleDateString(undefined, { month: 'long', year: 'numeric' })
      : rawLabel;
    return `<tr><td>${esc(label)}</td><td>${Number(row[countKey] || 0)}</td></tr>`;
  }).join('') || '<tr><td colspan="2">No records for this period</td></tr>';
  return `<section class="report-section">
    <h2>${title}</h2>
    <table>
      <thead><tr><th scope="col">Category</th><th scope="col">Count</th></tr></thead>
      <tbody>${body}</tbody>
      ${rows.length ? `<tfoot><tr><td>Total</td><td>${total}</td></tr></tfoot>` : ''}
    </table>
  </section>`;
}

function reportTimeline(rows) {
  const maxActivity = Math.max(1, ...rows.map(row =>
    row.concerns + row.messages + row.appointments));
  const totals = rows.reduce((total, row) => ({
    concerns: total.concerns + row.concerns,
    messages: total.messages + row.messages,
    appointments: total.appointments + row.appointments,
  }), { concerns: 0, messages: 0, appointments: 0 });
  const tableRows = rows.map(row => {
    const activityTotal = row.concerns + row.messages + row.appointments;
    const concernsWidth = (row.concerns / maxActivity) * 100;
    const messagesWidth = (row.messages / maxActivity) * 100;
    const appointmentsWidth = (row.appointments / maxActivity) * 100;
    return `<tr>
      <td>${esc(row.period)}</td>
      <td>${row.concerns}</td>
      <td>${row.messages}</td>
      <td>${row.appointments}</td>
      <td>
        <div class="timeline-bar" role="img" aria-label="${activityTotal} total activities: ${row.concerns} concerns, ${row.messages} messages, ${row.appointments} appointments">
          <span class="timeline-concerns" style="width:${concernsWidth}%"></span>
          <span class="timeline-messages" style="width:${messagesWidth}%"></span>
          <span class="timeline-appointments" style="width:${appointmentsWidth}%"></span>
        </div>
      </td>
    </tr>`;
  }).join('') || '<tr><td colspan="5">No activity for this period</td></tr>';
  return `<section class="report-section">
    <h2>Activity Trend</h2>
    <div class="report-legend" aria-label="Activity chart legend">
      <span><i class="legend-concerns"></i>Concerns</span>
      <span><i class="legend-messages"></i>Messages</span>
      <span><i class="legend-appointments"></i>Appointments</span>
    </div>
    <table class="report-timeline">
      <thead><tr>
        <th scope="col">Period</th><th scope="col">Concerns</th>
        <th scope="col">Messages</th><th scope="col">Appointments</th>
        <th scope="col">Relative activity</th>
      </tr></thead>
      <tbody>${tableRows}</tbody>
      <tfoot><tr><td>Total</td><td>${totals.concerns}</td><td>${totals.messages}</td><td>${totals.appointments}</td><td></td></tr></tfoot>
    </table>
  </section>`;
}

function dateInputValue(date) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function formatReportDate(value, options = { month: 'long', day: 'numeric', year: 'numeric' }) {
  return new Date(`${value}T12:00:00`).toLocaleDateString(undefined, options);
}

function getReportPeriod() {
  const type = document.getElementById('period-type').value;
  const periodDate = document.getElementById('period-date').value;
  const periodMonth = document.getElementById('period-month').value;
  let startDate = '';
  let endDate = '';
  let label = '';

  if (type === 'daily' || type === 'weekly') {
    if (!periodDate) throw new Error('Choose a date for the report period');
    const date = new Date(`${periodDate}T12:00:00`);
    if (type === 'daily') {
      startDate = periodDate;
      endDate = periodDate;
      label = `Daily · ${formatReportDate(periodDate)}`;
    } else {
      const dayFromMonday = (date.getDay() + 6) % 7;
      date.setDate(date.getDate() - dayFromMonday);
      startDate = dateInputValue(date);
      date.setDate(date.getDate() + 6);
      endDate = dateInputValue(date);
      label = `Weekly · ${formatReportDate(startDate)} to ${formatReportDate(endDate)}`;
    }
  } else if (type === 'monthly') {
    if (!periodMonth) throw new Error('Choose a month for the report');
    const [year, month] = periodMonth.split('-').map(Number);
    startDate = `${periodMonth}-01`;
    endDate = dateInputValue(new Date(year, month, 0));
    label = `Monthly · ${new Date(year, month - 1, 1, 12).toLocaleDateString(undefined, { month: 'long', year: 'numeric' })}`;
  } else {
    startDate = document.getElementById('start-date').value;
    endDate = document.getElementById('end-date').value;
    if (!startDate || !endDate) throw new Error('Choose both the start and end dates');
    if (startDate > endDate) throw new Error('The start date must be on or before the end date');
    const periodName = type === 'semester-1' ? 'First Semester'
      : type === 'semester-2' ? 'Second Semester' : 'Custom date range';
    label = `${periodName} · ${formatReportDate(startDate)} to ${formatReportDate(endDate)}`;
  }

  return { type, startDate, endDate, label };
}

function updatePeriodControls() {
  const type = document.getElementById('period-type').value;
  const anchoredPeriod = ['daily', 'weekly'].includes(type);
  const monthlyPeriod = type === 'monthly';
  const semesterPeriod = type === 'semester-1' || type === 'semester-2';
  const customPeriod = type === 'custom';
  document.getElementById('period-date-field').classList.toggle('hidden', !anchoredPeriod);
  document.getElementById('period-month-field').classList.toggle('hidden', !monthlyPeriod);
  document.getElementById('period-range-fields').classList.toggle('hidden', !semesterPeriod && !customPeriod);
  document.getElementById('period-range-title').textContent = type === 'semester-1'
    ? 'First semester start date' : type === 'semester-2' ? 'Second semester start date' : 'Start date';
  document.getElementById('semester-help').classList.toggle('hidden', !semesterPeriod);
  document.getElementById('period-date-label').textContent = type === 'weekly' ? 'Date in week' : 'Report date';
}

function wordTableFromReport(table) {
  const isActivityTimeline = table.classList.contains('report-timeline');
  const sourceColumnCount = table.tHead?.rows[0]?.cells.length || table.rows[0]?.cells.length || 1;
  const columnCount = Math.max(1, sourceColumnCount - (isActivityTimeline ? 1 : 0));
  const rows = Array.from(table.rows).map((row, rowIndex) => {
    const isHeader = row.parentElement.tagName === 'THEAD';
    const isTotal = row.parentElement.tagName === 'TFOOT';
    const sourceCells = Array.from(row.cells).filter((cell, index) =>
      !isActivityTimeline || index < columnCount);
    const cells = sourceCells.map(cell => {
      const chart = cell.querySelector('.timeline-bar');
      const text = chart ? chart.getAttribute('aria-label') : cell.innerText.trim();
      return { text, span: Math.min(Math.max(1, cell.colSpan), columnCount) };
    });
    const columnsUsed = cells.reduce((count, cell) => count + cell.span, 0);
    for (let column = columnsUsed; column < columnCount; column += 1) {
      cells.push({ text: '', span: 1 });
    }
    return new docx.TableRow({
      tableHeader: isHeader,
      children: cells.map((cell, index) => new docx.TableCell({
        ...(cell.span > 1 ? { columnSpan: cell.span } : {}),
        children: [new docx.Paragraph({
          alignment: index === 0 ? docx.AlignmentType.LEFT : docx.AlignmentType.CENTER,
          children: [new docx.TextRun({
            text: cell.text,
            bold: isHeader || isTotal,
            color: isHeader ? 'FFFFFF' : '26332B',
            size: 18,
          })],
        })],
        verticalAlign: docx.VerticalAlign.CENTER,
        margins: { top: 80, bottom: 80, left: 100, right: 100 },
        ...(isHeader
          ? { shading: { fill: '1E7A34', type: docx.ShadingType.CLEAR } }
          : isTotal
            ? { shading: { fill: 'E3F3E5', type: docx.ShadingType.CLEAR } }
            : { shading: { fill: rowIndex % 2 ? 'FFFFFF' : 'F5F8F5', type: docx.ShadingType.CLEAR } }),
      })),
    });
  });
  return new docx.Table({
    rows,
    width: { size: 100, type: docx.WidthType.PERCENTAGE },
    borders: {
      top: { style: docx.BorderStyle.SINGLE, size: 4, color: 'D5DED7' },
      bottom: { style: docx.BorderStyle.SINGLE, size: 4, color: 'D5DED7' },
      left: { style: docx.BorderStyle.SINGLE, size: 4, color: 'D5DED7' },
      right: { style: docx.BorderStyle.SINGLE, size: 4, color: 'D5DED7' },
      insideHorizontal: { style: docx.BorderStyle.SINGLE, size: 4, color: 'D5DED7' },
      insideVertical: { style: docx.BorderStyle.SINGLE, size: 4, color: 'D5DED7' },
    },
  });
}

async function downloadDocxReport() {
  if (!currentReport) return;
  const button = document.getElementById('download-docx');
  const error = document.getElementById('report-error');
  button.disabled = true;
  button.textContent = 'Preparing Word document...';
  error.classList.add('hidden');
  try {
    if (!window.docx) throw new Error('Word export library did not load. Check your internet connection and try again.');
    const report = document.querySelector('.report-document');
    if (!report) throw new Error('Generate the report before downloading it.');
    const logo = report.querySelector('.report-heading img');
    const logoResponse = await fetch(logo.src);
    if (!logoResponse.ok) throw new Error('Could not load the college logo for the Word report.');
    const logoBytes = new Uint8Array(await logoResponse.arrayBuffer());
    const heading = report.querySelector('.report-heading');
    const title = heading.querySelector('h1')?.innerText.trim() || 'Guidance Office Report';
    const children = [
      new docx.Paragraph({
        children: [
          new docx.ImageRun({ data: logoBytes, transformation: { width: 58, height: 58 } }),
          new docx.TextRun({ text: `  ${title}`, bold: true, size: 30, color: '1E7A34' }),
        ],
        alignment: docx.AlignmentType.CENTER,
        spacing: { after: 100 },
      }),
    ];

    Array.from(report.children).forEach(element => {
      if (element.classList.contains('report-heading')) {
        element.querySelectorAll('p').forEach(paragraph => children.push(new docx.Paragraph({
          children: [new docx.TextRun({
            text: paragraph.innerText.trim(),
            size: 20,
            color: '526057',
          })],
          alignment: docx.AlignmentType.CENTER,
          spacing: { after: 40 },
        })));
      } else if (element.classList.contains('report-meta')) {
        element.querySelectorAll('div').forEach(meta => children.push(new docx.Paragraph({
          children: [new docx.TextRun({ text: meta.innerText.trim(), size: 20, color: '26332B' })],
          spacing: { after: 100 },
        })));
        children.push(new docx.Paragraph({ text: '', spacing: { after: 160 } }));
      } else if (element.matches('h2')) {
        children.push(new docx.Paragraph({
          children: [new docx.TextRun({
            text: element.innerText.trim(),
            bold: true,
            size: 24,
            color: '1E7A34',
          })],
          heading: docx.HeadingLevel.HEADING_1,
          spacing: { before: 300, after: 140 },
        }));
      } else if (element.classList.contains('report-section')) {
        const sectionTitle = element.querySelector('h2');
        if (sectionTitle) children.push(new docx.Paragraph({
          children: [new docx.TextRun({
            text: sectionTitle.innerText.trim(),
            bold: true,
            size: 22,
            color: '1E7A34',
          })],
          heading: docx.HeadingLevel.HEADING_2,
          spacing: { before: 240, after: 100 },
        }));
        const legend = element.querySelector('.report-legend');
        if (legend) children.push(new docx.Paragraph({
          children: [new docx.TextRun({
            text: `Activity series (shown as counts below): ${Array.from(legend.querySelectorAll('span')).map(item => item.innerText.trim()).join(' · ')}`,
            size: 18,
            color: '526057',
          })],
          spacing: { after: 120 },
        }));
        const table = element.querySelector('table');
        if (table) {
          children.push(wordTableFromReport(table));
          children.push(new docx.Paragraph({ text: '', spacing: { after: 120 } }));
        }
      } else if (element.matches('p')) {
        children.push(new docx.Paragraph({
          text: element.innerText.trim(),
          spacing: { before: 300 },
        }));
      }
    });

    const r = currentReport;
    const wordDocument = new docx.Document({
      styles: {
        default: {
          document: {
            run: { font: 'Arial', size: 20, color: '26332B' },
            paragraph: { spacing: { after: 100 } },
          },
        },
      },
      sections: [{
        properties: {
          page: {
            size: { orientation: docx.PageOrientation.PORTRAIT },
            margin: { top: 720, right: 720, bottom: 720, left: 720 },
          },
        },
        children,
      }],
    });
    const blob = await docx.Packer.toBlob(wordDocument);
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = `GOSS-Report-${r.period.start_date}-to-${r.period.end_date}.docx`;
    link.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  } catch (err) {
    error.textContent = err.message || 'Could not create the Word document.';
    error.classList.remove('hidden');
  } finally {
    button.disabled = false;
    button.textContent = 'Download DOCX';
  }
}

function renderReport(r) {
  currentReport = r;
  r.generated_at = new Date().toLocaleString(undefined, {
    dateStyle: 'long', timeStyle: 'short',
  });
  document.getElementById('download-docx').disabled = false;
  document.getElementById('print-report').disabled = false;
  const summaryRows = [
    ['Student concerns', r.concerns_total],
    ['Students with concerns', r.students_with_concerns],
    ['Urgent concerns', `${r.urgent_concerns} (${r.concerns_total ? Math.round(r.urgent_concerns / r.concerns_total * 100) : 0}%)`],
    ['Non-urgent concerns', r.non_urgent_concerns],
    ['Messages (count only)', r.messages_total],
    ['Appointments', r.appointments_total],
    ['Appointments awaiting confirmation', (r.appointments_by_status.find(x => x.status === 'Pending') || {}).count || 0],
    ['Completed appointments', (r.appointments_by_status.find(x => x.status === 'Completed') || {}).count || 0],
    ['No-show appointments', (r.appointments_by_status.find(x => x.status === 'No-Show') || {}).count || 0],
  ].map(([label, count]) => `<tr><td>${esc(label)}</td><td>${esc(String(count ?? 0))}</td></tr>`).join('');

  document.getElementById('report-results').innerHTML = `
    <article class="report-document">
      <header class="report-heading">
        <img src="../assets/img/logo.png" alt="Tangub City Global College logo">
        <div>
          <h1>Guidance Office Report</h1>
          <p>Tangub City Global College</p>
          <p>Guidance Office Support System</p>
        </div>
      </header>
      <div class="report-meta">
        <div><strong>Reporting period:</strong> ${esc(r.period.label)}</div>
        <div><strong>Generated:</strong> ${esc(r.generated_at)}</div>
      </div>
      <section class="report-section report-summary">
        <h2>Executive Summary</h2>
        <table>
          <thead><tr><th scope="col">Measure</th><th scope="col">Total</th></tr></thead>
          <tbody>${summaryRows}</tbody>
        </table>
      </section>
      <h2>Detailed Activity</h2>
      ${reportTimeline(r.activity_timeline)}
      ${reportRows('Concerns by Case Status', r.concerns_by_status, 'status', 'count')}
      ${reportRows('Concerns by Category', r.concerns_by_category, 'category', 'count')}
      ${reportRows('Messages by Sender Role', r.messages_by_sender_role, 'role', 'count')}
      ${reportRows('Appointments by Status', r.appointments_by_status, 'status', 'count')}
      ${reportRows('Concerns by Month', r.concerns_by_month, 'month', 'count')}
      ${reportRows('Messages by Month', r.messages_by_month, 'month', 'count')}
      ${reportRows('Appointments by Month', r.appointments_by_month, 'month', 'count')}
      ${reportRows('Counselor Appointment Workload', r.counselor_workload, 'name', 'count')}
    </article>
  `;
}

function closePrintPreview() {
  const overlay = document.getElementById('print-preview-overlay');
  overlay.classList.add('hidden');
  document.getElementById('print-report').focus();
}

function openPrintPreview() {
  const report = document.querySelector('.report-document');
  if (!report) return;
  document.getElementById('print-preview-content').replaceChildren(report.cloneNode(true));
  document.getElementById('print-preview-overlay').classList.remove('hidden');
  document.getElementById('close-print-preview').focus();
}

async function generateReport() {
  const button = document.getElementById('generate-report');
  const error = document.getElementById('report-error');
  const results = document.getElementById('report-results');
  error.classList.add('hidden');
  currentReport = null;
  document.getElementById('download-docx').disabled = true;
  document.getElementById('print-report').disabled = true;
  button.disabled = true;
  button.textContent = 'Generating...';
  try {
    const period = getReportPeriod();
    const query = new URLSearchParams();
    query.set('start_date', period.startDate);
    query.set('end_date', period.endDate);
    query.set('period_type', period.type);
    const report = await api('/api/admin.php?action=reports&' + query.toString());
    report.period.label = period.label;
    renderReport(report);
    if (new URLSearchParams(location.search).get('print') === '1') {
      openPrintPreview();
    }
  } catch (err) {
    results.innerHTML = '';
    error.textContent = err.message;
    error.classList.remove('hidden');
  } finally {
    button.disabled = false;
    button.textContent = 'Generate Report';
  }
}

(async () => {
  const user = await requireAuth();
  if (!user) return;
  if (user.role !== 'admin') { location.href = user.role === 'staff' ? '../staff/dashboard.html' : '../student/dashboard.html'; return; }
  renderShell(user, 'reports', 'Reports & Analytics');

  const content = document.getElementById('page-content');
  const today = new Date();
  const todayValue = dateInputValue(today);
  const currentMonth = todayValue.slice(0, 7);
  content.innerHTML = `
    <div class="card report-controls" style="margin-bottom:20px">
      <div class="section-header"><div class="section-title">Generate Report</div></div>
      <div style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
        <div class="field" style="margin:0">
          <label for="period-type">Report period</label>
          <select id="period-type">
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly" selected>Monthly</option>
            <option value="semester-1">First Semester</option>
            <option value="semester-2">Second Semester</option>
            <option value="custom">Custom date range</option>
          </select>
        </div>
        <div class="field" id="period-date-field" style="margin:0">
          <label id="period-date-label" for="period-date">Report date</label>
          <input type="date" id="period-date" value="${todayValue}">
        </div>
        <div class="field hidden" id="period-month-field" style="margin:0">
          <label for="period-month">Report month</label>
          <input type="month" id="period-month" value="${currentMonth}">
        </div>
        <div id="period-range-fields" class="hidden" style="display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap">
          <div class="field" style="margin:0">
            <label id="period-range-title" for="start-date">Start date</label>
            <input type="date" id="start-date">
          </div>
          <div class="field" style="margin:0">
            <label for="end-date">End date</label>
            <input type="date" id="end-date">
          </div>
        </div>
        <button class="btn" id="generate-report" type="button">Generate Report</button>
        <button class="btn btn-outline" id="download-docx" type="button" disabled>Download DOCX</button>
        <button class="btn btn-outline" id="print-report" type="button" disabled>Print Report</button>
      </div>
      <p class="list-item-sub hidden" id="semester-help" style="margin:12px 0 0">Enter the semester date range based on your school's academic calendar.</p>
    </div>
    <div class="modal-overlay hidden print-preview-overlay" id="print-preview-overlay">
      <section class="modal print-preview-dialog" role="dialog" aria-modal="true" aria-labelledby="print-preview-title">
        <header class="print-preview-header">
          <div>
            <h2 id="print-preview-title">Print Preview</h2>
            <p>Review the report below. This is the content that will be sent to print.</p>
          </div>
          <div class="print-preview-actions">
            <button class="btn btn-outline" id="close-print-preview" type="button">Back</button>
            <button class="btn" id="confirm-print-report" type="button">Print Now</button>
          </div>
        </header>
        <div class="print-preview-content" id="print-preview-content"></div>
      </section>
    </div>
    <div id="report-error" class="error-box hidden"></div>
    <div id="report-results"><div class="empty-state">Choose an optional date range and generate a report.</div></div>
  `;
  document.getElementById('period-type').addEventListener('change', updatePeriodControls);
  document.getElementById('period-type').addEventListener('change', () => {
    if (['semester-1', 'semester-2', 'custom'].includes(document.getElementById('period-type').value)) return;
    generateReport();
  });
  document.getElementById('period-date').addEventListener('change', generateReport);
  document.getElementById('period-month').addEventListener('change', generateReport);
  const generateForDateRange = () => {
    const type = document.getElementById('period-type').value;
    if (['custom', 'semester-1', 'semester-2'].includes(type) &&
        document.getElementById('start-date').value &&
        document.getElementById('end-date').value) generateReport();
  };
  document.getElementById('start-date').addEventListener('change', generateForDateRange);
  document.getElementById('end-date').addEventListener('change', generateForDateRange);
  document.getElementById('generate-report').addEventListener('click', generateReport);
  document.getElementById('download-docx').addEventListener('click', downloadDocxReport);
  document.getElementById('print-report').addEventListener('click', openPrintPreview);
  document.getElementById('close-print-preview').addEventListener('click', closePrintPreview);
  document.getElementById('confirm-print-report').addEventListener('click', () => window.print());
  document.getElementById('print-preview-overlay').addEventListener('click', event => {
    if (event.target.id === 'print-preview-overlay') closePrintPreview();
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && !document.getElementById('print-preview-overlay').classList.contains('hidden')) {
      closePrintPreview();
    }
  });
  updatePeriodControls();
  await generateReport();
})();
</script>
</body>
</html>
