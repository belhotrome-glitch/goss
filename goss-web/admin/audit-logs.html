<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audit Logs — GOSS Admin</title>
<link rel="icon" type="image/png" href="../assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app-shell" id="shell"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>window.ROOT_PATH = "../";</script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
(async () => {
  const user = await requireAuth();
  if (!user) return;
  if (user.role !== 'admin') { location.href = user.role === 'staff' ? '../staff/dashboard.html' : '../student/dashboard.html'; return; }
  renderShell(user, 'audit', 'Security Audit Logs');

  const content = document.getElementById('page-content');
  content.innerHTML = `<div class="empty-state">Loading...</div>`;

  const { logs } = await api('/api/admin.php?action=audit_logs');
  const rows = logs.map(l => `
    <tr>
      <td>${fmtDateTime(l.created_at)}</td>
      <td>${esc(l.actor_name)}</td>
      <td><span class="chip">${esc(l.action)}</span></td>
      <td>${esc(l.target_type || '—')}</td>
      <td style="font-family:monospace;font-size:11px">${esc(l.target_id || '—')}</td>
    </tr>`).join('') || '<tr><td colspan="5"><div class="empty-state">No audit events yet</div></td></tr>';

  content.innerHTML = `
    <div class="card">
      <div class="section-header"><div class="section-title">Recent Security Events (latest 200)</div></div>
      <div style="overflow-x:auto">
        <table>
          <thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Target Type</th><th>Target ID</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      <p class="list-item-sub" style="margin-top:12px">Logs never contain passwords, tokens, or message content — only who did what, to which record, and when.</p>
    </div>
  `;
})();
</script>
</body>
</html>
