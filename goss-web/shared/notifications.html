<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notifications — GOSS</title>
<link rel="icon" type="image/png" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app-shell" id="shell"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>window.ROOT_PATH = "../";</script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
async function markRead(id) {
  await api('/api/notifications.php?action=mark_read', { method: 'POST', body: { id } });
  await load();
  refreshNotifBadge();
}
async function markAll() {
  await api('/api/notifications.php?action=mark_all_read', { method: 'POST' });
  await load();
  refreshNotifBadge();
}
async function load() {
  const { notifications } = await api('/api/notifications.php?action=list');
  document.getElementById('notif-list').innerHTML = notifications.length ? notifications.map(n => `
    <div class="list-item" style="${n.is_read ? '' : 'background:var(--primary-teal-light);border-radius:8px;padding:14px'}">
      <div class="list-item-main">
        <div class="list-item-title">${esc(n.title)}</div>
        <div class="list-item-sub">${esc(n.body)}</div>
        <div class="chip">${fmtDateTime(n.created_at)}</div>
      </div>
      ${n.is_read ? '' : `<button class="btn btn-sm btn-outline" onclick="markRead('${n.id}')">Mark read</button>`}
    </div>
  `).join('') : '<div class="empty-state"><div class="icon">🔔</div>No notifications</div>';
}

(async () => {
  const user = await requireAuth();
  if (!user) return;
  renderShell(user, 'notifications', 'Notifications');
  document.getElementById('page-content').innerHTML = `
    <div class="section-header">
      <div class="section-title">All Notifications</div>
      <button class="btn btn-sm btn-outline" onclick="markAll()">Mark all as read</button>
    </div>
    <div class="card" id="notif-list"></div>
  `;
  await load();
})();
</script>
</body>
</html>
