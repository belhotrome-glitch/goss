<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Concern Detail — GOSS Staff</title>
<link rel="icon" type="image/png" href="../assets/img/logo.png">
<link rel="stylesheet" href="../assets/css/style.css">
</head>
<body>
<div class="app-shell" id="shell"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>window.ROOT_PATH = "../";</script>
<script src="../assets/js/supabase-config.js"></script>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/shell.js"></script>
<script>
const params = new URLSearchParams(location.search);
const concernId = params.get('id');
let CURRENT_USER = null;
let chatChannel = null;
const STATUSES = ['Pending', 'In Progress', 'Resolved', 'Closed'];

async function setStatus(status) {
  await api('/api/concerns.php?action=update', { method: 'POST', body: { id: concernId, status } });
  toast('Status updated to ' + status);
  await loadDetail();
}

async function claimCase() {
  await api('/api/concerns.php?action=update', { method: 'POST', body: { id: concernId, assign_to_me: true } });
  toast('Case assigned to you');
  await loadDetail();
}

async function loadDetail() {
  const { concern, messages } = await api('/api/concerns.php?action=detail&id=' + concernId);
  markMessagesRead(concernId, CURRENT_USER.id);
  const thread = messages.map(m => `
    <div class="msg ${m.sender_id == CURRENT_USER.id ? 'mine' : 'theirs'}">
      <div>${esc(m.message)}</div>
      <div class="msg-meta">${esc(m.sender_name || (m.sender_id == CURRENT_USER.id ? CURRENT_USER.full_name : 'Student'))} · ${fmtDateTime(m.sent_at)}</div>
    </div>
  `).join('');

  const statusButtons = STATUSES.map(s => `
    <button class="btn btn-sm ${s === concern.status ? '' : 'btn-outline'}" onclick="setStatus('${s}')">${s}</button>
  `).join('');

  document.getElementById('detail-container').innerHTML = `
    <div class="card">
      <div class="section-header">
        <div>
          <div style="font-size:17px;font-weight:700">${esc(concern.subject)}</div>
          <div class="list-item-sub">${esc(concern.student_name)} ${concern.student_no ? '(' + esc(concern.student_no) + ')' : ''}${concern.student_course ? ' · ' + esc(concern.student_course) : ''} · ${esc(concern.category)} · Submitted ${fmtDate(concern.created_at)}</div>
        </div>
        <span class="badge ${badgeClass(concern.status)}">${concern.status}</span>
      </div>
      <div class="list-item-meta" style="margin-bottom:14px">
        ${concern.is_urgent ? '<span class="badge badge-urgent">Urgent</span>' : ''}
        <span class="chip">${concern.staff_name ? 'Assigned to ' + esc(concern.staff_name) : 'Unassigned'}</span>
        ${!concern.assigned_to ? '<button class="btn btn-sm" style="margin-left:8px" onclick="claimCase()">Claim this case</button>' : ''}
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">${statusButtons}</div>
      <div style="font-size:13px;font-weight:600;margin-bottom:8px">Conversation with ${esc(concern.student_name || 'Student')}</div>
      <div class="thread">${thread}</div>
      <form id="reply-form" class="reply-box">
        <textarea id="reply-text" rows="2" placeholder="Type a reply..." required></textarea>
        <button type="submit" class="btn" style="width:auto">Send</button>
      </form>
    </div>
  `;

  document.getElementById('reply-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const text = document.getElementById('reply-text').value.trim();
    if (!text) return;
    await api('/api/concerns.php?action=reply', { method: 'POST', body: { concern_id: concernId, message: text } });
    await loadDetail();
  });
}

(async () => {
  const user = await requireAuth();
  if (!user) return;
  if (user.role !== 'staff') { location.href = '../student/dashboard.html'; return; }
  CURRENT_USER = user;
  renderShell(user, 'concerns', 'Concern Details');

  document.getElementById('page-content').innerHTML = `
    <a href="concerns.html" style="font-size:13px;color:var(--primary-teal);font-weight:600">← Back</a>
    <div style="margin-top:14px" id="detail-container"></div>
  `;

  await loadDetail();

  chatChannel = subscribeToConcernMessages(concernId, () => { loadDetail(); });
  window.addEventListener('beforeunload', () => unsubscribeChannel(chatChannel));
})();
</script>
</body>
</html>
